server {
    listen 8000;
    resolver 127.0.0.11 ipv6=off valid=10s;

    set $telemetry_upstream http://telemetry-service:8000;
    set $insights_upstream http://insights-service:8001;
    set $jupyter_upstream http://jupyter:8888;

    location = /api/telemetry {
        proxy_pass $telemetry_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/telemetry/ {
        proxy_pass $telemetry_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /jupyter {
        return 302 /jupyter/;
    }

    location /jupyter/ {
        proxy_pass $jupyter_upstream/jupyter/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $insights_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
