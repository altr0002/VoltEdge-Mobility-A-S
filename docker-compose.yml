services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-voltedge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-voltedge}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voltedge_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-voltedge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltedge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  telemetry-service:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://voltedge:voltedge@postgres:5432/voltedge_monitoring}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://voltedge:voltedge@rabbitmq:5672/}
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-true}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${TELEMETRY_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  insights-service:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://voltedge:voltedge@postgres:5432/voltedge_monitoring}
    command: ["uvicorn", "app.insights_main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "${INSIGHTS_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      telemetry-service:
        condition: service_started
      insights-service:
        condition: service_started

volumes:
  postgres_data:
  rabbitmq_data:
